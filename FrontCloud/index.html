<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taller 1 - PaaS Coolify</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #334155;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #a855f7;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-block;
            background: #065f46;
            color: #34d399;
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        footer {
            background: #0b1120;
            border-top: 1px solid #1e293b;
            padding: 1.2rem;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        footer strong {
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <main>
        <div class="card">
            <span class="badge">Estado: En línea</span>
            <h1 style="margin-top: 1rem;">Oscar Weko</h1>

                <img src="image0.jpg" alt="Descripción de la imagen" style="width: 50%;">
            <p>Demostración práctica de despliegue mediante un PaaS Self-Hosted y exposición a través de Cloudflare
                Tunnels.</p>
        </div>
    </main>

    <footer>
        <p>Nombre: <strong>Diego Adaos</strong> | Año: <strong>2026</strong> | Asignatura: <strong>Cloud
                Computing</strong></p>
    </footer>

</body>

</html>
